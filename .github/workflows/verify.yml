name: Verify portable comparison
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: node scripts/compare.mjs corpus/snapshots/article-policy.a.json corpus/snapshots/article-policy.b.json > comparison.json
      - run: node tests/measure.mjs
